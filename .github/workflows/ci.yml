name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://payments:payments@localhost:5432/payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create schema and views
        run: |
          for f in db/01_schema.sql db/02_views.sql db/03_bi_views.sql db/04_treasury.sql db/05_audit.sql db/06_api_role.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Regenerate the seed and the incremental file sets and check they match the committed files
        run: |
          python seed/generate_seed.py
          python seed/generate_seed.py --delta 1
          python seed/generate_seed.py --delta 2
          git diff --exit-code -- seed/data seed/deltas
      - name: Load (dry-run, then commit, then again to prove idempotency)
        run: |
          python etl/load_seed.py
          python etl/load_seed.py --apply
          python etl/load_seed.py --apply
      - name: Incremental loads (delta 2 carries two invalid rows on purpose; they must be quarantined, not abort the run)
        run: |
          for n in 1 2; do
            python etl/load_seed.py --source seed/deltas/delta_$n
            python etl/load_seed.py --source seed/deltas/delta_$n --apply
          done
          python etl/load_seed.py --source seed/deltas/delta_2 --apply   # again: everything unchanged
      - name: Show the audit trail
        run: |
          psql "$DATABASE_URL" -c "SELECT mode, status, counts FROM audit.load_run ORDER BY started_at"
          psql "$DATABASE_URL" -c "SELECT reason, count(*) FROM audit.rejected_row GROUP BY reason"
      - name: Start the API and call it (the contract is published at /openapi.json)
        run: |
          API_DATABASE_URL=postgresql://api_reader:api_reader@localhost:5432/payments \
            uvicorn api.main:app --port 8000 &
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs "localhost:8000/orders?status=pendiente&limit=2"
          curl -fs "localhost:8000/payables/aging?as_of=2026-11-01"
          curl -fs "localhost:8000/runs?status=succeeded_with_rejects"
          curl -fs localhost:8000/openapi.json > /dev/null
      - name: Unit tests and data-quality rules
        run: python -m unittest discover -s tests -v

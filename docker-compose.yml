# Throw-away PostgreSQL for local development. Credentials are for local use only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "${PG_PORT:-5432}:5432"      # set PG_PORT when 5432 is already taken on your machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
